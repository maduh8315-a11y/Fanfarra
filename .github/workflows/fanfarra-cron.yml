name: Fanfarra Cron

on:
  schedule:
    # Todo dia às 03:00 UTC = 00:00 em Brasília (horário de verão à parte)
    - cron: "0 3 * * *"
  workflow_dispatch: {} # permite rodar manualmente pelo GitHub também

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --include=dev firebase-admin
      - run: node scripts/cron.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}