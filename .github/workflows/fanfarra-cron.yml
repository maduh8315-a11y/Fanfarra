name: Fanfarra Cron

concurrency:
  group: fanfarra-cron
  cancel-in-progress: false

on:
  workflow_dispatch: {} # disparado pelo app quando você abre/inicia uma edição
  schedule:
    # "Vigia": roda a cada 10 minutos. Quando detecta que um prazo está a
    # menos de 40min de distância, o próprio script (cron.mjs) passa a se
    # re-verificar sozinho de 2 em 2 minutos DENTRO dessa mesma execução —
    # sem depender do GitHub Actions disparar de novo no minuto exato (o
    # schedule nativo dele pode atrasar bastante, isso é conhecido).
   - cron: "*/10 * * * *"

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/cron.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_FAST_JOB_ID: ${{ secrets.CRONJOB_FAST_JOB_ID }}