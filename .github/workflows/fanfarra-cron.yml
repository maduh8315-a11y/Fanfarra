
name: Fanfarra Cron

on:
  schedule:
    # Roda a cada 15 min, pra abrir/fechar perto do horário exato marcado.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pelo GitHub também

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --include=dev firebase-admin
      - run: node scripts/cron.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}