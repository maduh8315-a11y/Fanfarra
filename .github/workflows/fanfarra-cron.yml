name: Fanfarra Cron

concurrency:
  group: fanfarra-cron
  cancel-in-progress: false

on:
  workflow_dispatch: {} # disparado pelo app quando você abre/inicia uma edição
  schedule:
    # Motor principal do cron. Roda a cada 20 minutos como "vigia" — cada
    # execução é barata (só lê a config de votação) e serve pra detectar
    # quando falta pouco pra um prazo, ligando o job rápido nesse momento.
   - cron: "*/30 * * * *"

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/cron.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_FAST_JOB_ID: ${{ secrets.CRONJOB_FAST_JOB_ID }}