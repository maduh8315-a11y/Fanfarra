name: Fanfarra Cron

concurrency:
  group: fanfarra-cron
  cancel-in-progress: false

on:
  workflow_dispatch: {} # disparado pelo app quando você abre/inicia uma edição
  schedule:
    # Motor principal do cron. Roda sozinho a cada 5 minutos, sem depender
    # de nenhuma execução anterior ter dado certo — cada disparo é
    # independente. Se uma execução falhar por qualquer motivo, a próxima
    # roda do mesmo jeito 5min depois, sem corrente pra quebrar.
    - cron: "*/5 * * * *"

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/cron.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_FAST_JOB_ID: ${{ secrets.CRONJOB_FAST_JOB_ID }}