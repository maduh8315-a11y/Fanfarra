name: Gerar keystore de debug fixo

on:
  workflow_dispatch: {}

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Criar o keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Mostrar o SHA-1 (copie do log)
        run: keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Gerar versão em base64 (copie do log)
        run: base64 -w0 debug.keystore

      - name: Disponibilizar o keystore pra download
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore